version: 2
language: ko-KR
reviews:
  profile: chill
  review_details: true
  auto_review:
    enabled: true
    drafts: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
  auto_approvals:
    enabled: false
  path_instructions:
    - path: "features/**/*.md"
      instructions: |
        AGENTS.md의 문서 조회·원문 연결·기획 검토 기준 적용.
    - path: "policies/**/*.md"
      instructions: |
        AGENTS.md의 계승·정책·결정 근거 및 기획 검토 기준 적용.
    - path: "updates/**/*.md"
      instructions: |
        AGENTS.md의 문서 조회·계승·기획 검토·업데이트 최종본 기준 적용.
    - path: "decisions/**/*.md"
      instructions: |
        AGENTS.md의 계승·정책·결정 근거 및 기획 검토 기준 적용.
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - files: "AGENTS.md"
        applyTo: "features/**/*.md"
      - files: "AGENTS.md"
        applyTo: "policies/**/*.md"
      - files: "AGENTS.md"
        applyTo: "updates/**/*.md"
      - files: "AGENTS.md"
        applyTo: "decisions/**/*.md"
